<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Clientes (Frontend)</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <header>
        <h1>Cliente API - Empresa de Serviços</h1>
    </header>

    <main>
        <section class="form-section">
            <h2>Cadastrar/Editar Cliente</h2>
            <form id="form-cliente">
                <input type="hidden" id="cliente-id">
                
                <div class="input-group">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" placeholder="Nome completo" required maxlength="120">
                </div>
                
                <div class="input-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" placeholder="email@exemplo.com" required maxlength="150">
                </div>

                <div class="input-group">
                    <label for="telefone">Telefone:</label>
                    <input type="text" id="telefone" placeholder="(XX) XXXX-XXXX" required maxlength="20">
                </div>

                <div class="input-group">
                    <label for="observacoes">Observações:</label>
                    <textarea id="observacoes" placeholder="Notas sobre o cliente" maxlength="255"></textarea>
                </div>

                <button type="submit" id="btn-salvar">Salvar Cliente</button>
            </form>
        </section>

        <section class="list-section">
            <h2>Lista de Clientes</h2>
            <table id="tabela-clientes-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Email</th>
                        <th>Cadastro</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-clientes-body">
                    </tbody>
            </table>
        </section>
    </main>
    
    <script src="app.js"></script>
</body>
</html>
